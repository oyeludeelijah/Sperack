<svg xmlns="http://www.w3.org/2000/svg" width="320" height="80" viewBox="0 0 320 80" role="img">
  <title>Sperack</title>
  <desc>Sperack logo dark mode — grid mark with blue resolved cell, wordmark with accented a, SPEND · TRACK tagline</desc>

  <!-- Grid mark: 3x3, cell=20, gap=6, total=72. Centered vertically: (80-72)/2=4 -->
  <g transform="translate(0, 4)">
    <rect x="0"  y="0"  width="20" height="20" rx="3" fill="#36343B" stroke="#605C6B" stroke-width="0.5"/>
    <rect x="26" y="0"  width="20" height="20" rx="3" fill="#36343B" stroke="#605C6B" stroke-width="0.5"/>
    <rect x="52" y="0"  width="20" height="20" rx="3" fill="#36343B" stroke="#605C6B" stroke-width="0.5"/>
    <rect x="0"  y="26" width="20" height="20" rx="3" fill="#36343B" stroke="#605C6B" stroke-width="0.5"/>
    <rect x="26" y="26" width="20" height="20" rx="3" fill="#36343B" stroke="#605C6B" stroke-width="0.5"/>
    <rect x="52" y="26" width="20" height="20" rx="3" fill="#36343B" stroke="#605C6B" stroke-width="0.5"/>
    <rect x="0"  y="52" width="20" height="20" rx="3" fill="#36343B" stroke="#605C6B" stroke-width="0.5"/>
    <rect x="26" y="52" width="20" height="20" rx="3" fill="#36343B" stroke="#605C6B" stroke-width="0.5"/>
    <rect x="52" y="52" width="20" height="20" rx="3" fill="#D0BCFF"/>
  </g>

  <!-- Type block centered to grid: grid center y=4+36=40. Block height ~54px. Wordmark baseline=43, line=55, tagline=68 -->
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="500" letter-spacing="-1.2">
    <tspan x="88" y="43" fill="#F0F0F4">sper</tspan><tspan fill="#D0BCFF">a</tspan><tspan fill="#F0F0F4">ck</tspan>
  </text>
  <line x1="88" y1="54" x2="318" y2="54" stroke="#2A2A2E" stroke-width="0.5"/>
  <text x="88" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#555560" letter-spacing="3">SPEND · TRACK</text>
</svg>
